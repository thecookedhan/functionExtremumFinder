<div class="p-6 rounded-3xl backdrop-blur-md border border-white/40"
     style="background: rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px 0 rgba(243, 170, 240, 0.2);">
    
    <h2 class="text-xl font-semibold text-gray-700 mb-6 flex items-center gap-2">
        <i data-lucide="sparkles" class="w-5 h-5 text-purple-400"></i>
        Configuration
    </h2>

    <form id="configForm" class="space-y-5">
        <div class="space-y-2">
            <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                <i data-lucide="function-square" class="w-4 h-4 text-blue-500"></i>
                Objective function
            </label>
            <select name="objectiveFunction" id="function-select"
                    class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-purple-300 outline-none appearance-none cursor-pointer font-medium text-gray-700 text-sm"
                    style="background: rgba(255, 255, 255, 0.5)">
                
                <optgroup label="Ciągłe i multimodalne">
                    <option value="michalewicz" selected>Michalewicz</option>
                    <option value="ackley">Ackley</option>
                    <option value="rastrigin">Rastrigin</option>
                    <option value="griewank">Griewank</option>
                    <option value="rana">Rana</option>
                    <option value="egg">Egg Holder</option>
                    <option value="schaffer">Schaffer 2</option>
                </optgroup>

                <optgroup label="Unimodalne">
                    <option value="hypersphere">Hypersphere</option>
                    <option value="hyperellipsoid">Hyperellipsoid</option>
                    <option value="schwefel">Schwefel</option>
                    <option value="rosenbrock">Rosenbrock</option>
                    <option value="styblinski">Styblinski and Tang</option>
                    <option value="keane">Keane</option>
                </optgroup>

                <optgroup label="Inne popularne/Specyficzne">
                    <option value="dejong3">De Jong 3</option>
                    <option value="dejong5">De Jong 5</option>
                    <option value="martin">Martin and Gaddy</option>
                    <option value="easom">Easom</option>
                    <option value="goldstein">Goldstein and Price</option>
                    <option value="picheny">Picheny, Goldstein and Price</option>
                    <option value="cormick">Mc Cormick</option>
                    <option value="himmel">Himmelblau</option>
                    <option value="pits">Pits and Holes</option>
                </optgroup>
            </select>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Number of variables</label>
                <input type="number" name="numVariables" value="2" min="1"
                       class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm transition-all focus:border-pink-300 outline-none"
                       style="background: rgba(255, 255, 255, 0.4)">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Variables range</label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" name="rangeFrom" placeholder="Od" value="0" step="any"
                           class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-pink-300 outline-none"
                           style="background: rgba(255, 255, 255, 0.4)">
                    <input type="number" name="rangeTo" placeholder="Do" value="3.1415" step="any"
                           class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-pink-300 outline-none"
                           style="background: rgba(255, 255, 255, 0.4)">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Population size</label>
                    <input type="number" name="populationSize" value="100" min="2"
                           class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-pink-300 outline-none"
                           style="background: rgba(255, 255, 255, 0.4)">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Number of epochs</label>
                    <input type="number" name="numEpochs" value="50" min="1"
                           class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-pink-300 outline-none"
                           style="background: rgba(255, 255, 255, 0.4)">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Bit precision per variable</label>
                <input type="number" name="precision" value="20" min="1" max="64"
                       class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-pink-300 outline-none"
                       style="background: rgba(255, 255, 255, 0.4)">
            </div>
        </div>

        <div class="h-px bg-gradient-to-r from-transparent via-white/50 to-transparent my-4"></div>

        <div class="space-y-3 p-3 rounded-2xl bg-white/20 border border-white/30">
            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-600">Selection method</label>
                <select name="selection" id="selection-select"
                        class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-blue-300 outline-none appearance-none cursor-pointer"
                        style="background: rgba(255, 255, 255, 0.4)">
                    <option value="best">Best</option>
                    <option value="roulette" selected>Roulette</option>
                    <option value="tournament">Tournament</option>
                </select>
            </div>

            <div id="tournament-params" class="hidden animate-in fade-in slide-in-from-top-1 space-y-1">
                <label class="text-[11px] font-bold text-blue-600 uppercase tracking-wider ml-1">Tournament size</label>
                <input type="number" name="tournamentSize" value="3" min="2"
                       class="w-full p-2 rounded-xl border border-blue-200 focus:border-blue-400 outline-none text-sm"
                       style="background: rgba(235, 245, 255, 0.5)">
            </div>

            <div id="best-params" class="hidden animate-in fade-in slide-in-from-top-1 space-y-1">
                <label class="text-[11px] font-bold text-pink-600 uppercase tracking-wider ml-1">Percent of best individuals (0-1)</label>
                <input type="number" name="bestPercentage" value="0.1" min="0.01" max="1" step="0.01"
                       class="w-full p-2 rounded-xl border border-pink-200 focus:border-pink-400 outline-none text-sm"
                       style="background: rgba(255, 240, 245, 0.5)">
            </div>
        </div>

        <div class="space-y-3 p-3 rounded-2xl bg-white/20 border border-white/30">
            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-600">Crossover method</label>
                <select name="crossover" id="crossover-select"
                        class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-blue-300 outline-none"
                        style="background: rgba(255, 255, 255, 0.4)">
                    <option value="one_point">One-point</option>
                    <option value="two_point">Two-point</option>
                    <option value="uniform">Uniform</option>
                    <option value="discrete">Discrete</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="text-[11px] font-medium text-gray-500 ml-1">Crossover probability (general)</label>
                <input type="number" name="crossoverProb" value="0.8" step="0.05" min="0" max="1"
                       class="w-full p-1.5 text-sm rounded-lg border border-white/30 outline-none focus:border-blue-200"
                       style="background: rgba(255, 255, 255, 0.2)">
            </div>
            <div id="uniform-params" class="hidden animate-in fade-in space-y-1">
                <label class="text-[11px] font-bold text-blue-600 uppercase tracking-wider ml-1">Gene inversion probability (0-1)</label>
                <input type="number" name="geneExchangeProb" value="0.5" step="0.05" min="0" max="1"
                       class="w-full p-1.5 text-sm rounded-lg border border-blue-200 outline-none"
                       style="background: rgba(235, 245, 255, 0.5)">
            </div>
        </div>

        <div class="space-y-3 p-3 rounded-2xl bg-white/20 border border-white/30">
            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-600">Mutation method</label>
                <select name="mutation" id="mutation-select"
                        class="w-full p-2 rounded-xl border border-white/50 backdrop-blur-sm focus:border-blue-300 outline-none"
                        style="background: rgba(255, 255, 255, 0.4)">
                    <option value="bit_flip" selected>Bit flip</option>
                    <option value="two_bits">Two bits flip</option>
                    <option value="edge">Edge</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="text-[11px] font-medium text-gray-500 ml-1">Mutation probability (general)</label>
                <input type="number" name="mutationProb" value="0.05" step="0.01" min="0" max="1"
                       class="w-full p-1.5 text-sm rounded-lg border border-white/30 outline-none focus:border-blue-200"
                       style="background: rgba(255, 255, 255, 0.2)">
            </div>
            <div id="bit-flip-params" class="hidden animate-in fade-in space-y-1">
                <label class="text-[11px] font-bold text-purple-600 uppercase tracking-wider ml-1">Bit inversion probability (0-1)</label>
                <input type="number" name="bitMutationProb" value="0.01" step="0.001" min="0" max="1"
                       class="w-full p-1.5 text-sm rounded-lg border border-purple-200 outline-none"
                       style="background: rgba(250, 240, 255, 0.5)">
            </div>
        </div>

        <div class="h-px bg-gradient-to-r from-transparent via-white/50 to-transparent my-4"></div>

        <div class="p-3 rounded-xl space-y-3" style="background: rgba(255, 255, 255, 0.3)">
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-700 font-medium">Elite strategy</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="eliteStrategy" id="elite-toggle" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-400"></div>
                </label>
            </div>

            <div id="elite-params" class="animate-in fade-in slide-in-from-top-1 space-y-1">
                <label class="text-[11px] font-bold text-purple-600 uppercase tracking-wider ml-1">Elitism size</label>
                <input type="number" name="eliteSize" value="2" min="1"
                    class="w-full p-2 rounded-xl border border-purple-200 focus:border-purple-400 outline-none text-sm"
                    style="background: rgba(250, 240, 255, 0.5)">
            </div>
        </div>

            <div class="p-3 rounded-xl space-y-3" style="background: rgba(255, 255, 255, 0.3)">
                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-700 font-medium">Inversion mutation</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="inversion" id="inversion-toggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-400"></div>
                    </label>
                </div>

                <div id="inversion-params" class="hidden animate-in fade-in slide-in-from-top-1 space-y-1">
                    <label class="text-[11px] font-bold text-purple-600 uppercase tracking-wider ml-1">Max segment ratio (0-1)</label>
                    <input type="number" name="maxSegmentRatio" value="0.2" step="0.05" min="0.05" max="1"
                        class="w-full p-2 rounded-xl border border-purple-200 focus:border-purple-400 outline-none text-sm"
                        style="background: rgba(250, 240, 255, 0.5)">
                </div>
            </div>


        <button type="submit" id="runBtn"
                class="w-full mt-6 py-4 rounded-2xl font-semibold text-white flex items-center justify-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50"
                style="background: linear-gradient(135deg, #f3aad1 0%, #f3aaf0 100%); box-shadow: 0 10px 30px rgba(243, 170, 209, 0.4);">
            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
            <span id="btnText">Run algorithm</span>
        </button>
    </form>
</div>

<script>
  if (window.lucide) {
    lucide.createIcons();
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
